<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sem conexão — Igreja do Nazareno A Casa</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #F2F2F2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    padding: 24px;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    background: #00000010;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 16px;
  }
  h1 { font-size: 17px; color: #000000; margin: 0 0 8px; font-weight: 600; }
  p { font-size: 13px; color: #707070; margin: 0 0 24px; max-width: 280px; line-height: 1.5; }
  button {
    background: #000000;
    color: #FFFFFF;
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { opacity: 0.85; }
</style>
</head>
<body>
  <div class="icon">📡</div>
  <h1>Sem conexão com a internet</h1>
  <p>Não conseguimos carregar a Casa agora. Confira sua conexão e tenta de novo.</p>
  <button onclick="location.reload()">Tentar novamente</button>
</body>
</html>
